plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.appmobile'
version = '0.1.0'

android {
  namespace "expo.modules.appmobile"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "net.java.dev.jna:jna:5.18.1@aar"
}
