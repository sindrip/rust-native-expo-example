name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo nextest run --locked --workspace

  js:
    name: JS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm --workspaces run format
      - run: npm --workspaces run lint

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@nextest
      - name: Generate coverage
        run: cargo llvm-cov nextest --workspace --cobertura --output-path cobertura.xml
        env:
          RUSTFLAGS: ""
      - name: Coverage report
        uses: clearlyip/code-coverage-report-action@v6
        id: coverage
        with:
          filename: cobertura.xml
      - name: Coverage summary
        run: echo "${{ steps.coverage.outputs.markdownReport }}" >> $GITHUB_STEP_SUMMARY

  bindings:
    name: Native / Generate bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask generate-bindings
      - uses: actions/upload-artifact@v4
        with:
          name: ios-bindings
          path: packages/app-mobile/ios/uniffi/
      - uses: actions/upload-artifact@v4
        with:
          name: android-bindings
          path: packages/app-mobile/android/src/main/java/uniffi/

  build-ios:
    name: Native / Build iOS
    if: false
    runs-on: macos-26
    timeout-minutes: 30
    needs: [rust, js, bindings]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: >-
          rustup target add
          aarch64-apple-ios
          aarch64-apple-ios-sim
      - uses: actions/download-artifact@v4
        with:
          name: ios-bindings
          path: packages/app-mobile/ios/uniffi/
      - run: cargo xtask build-ios
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Cache iOS prebuild
        uses: actions/cache@v4
        with:
          path: packages/app-mobile/example/ios
          key: ios-prebuild-${{ runner.os }}-${{ hashFiles('packages/app-mobile/example/app.json', 'packages/app-mobile/example/package.json') }}
      - name: Prebuild
        working-directory: packages/app-mobile/example
        run: npx expo prebuild -p ios
      - name: Build iOS simulator app
        working-directory: packages/app-mobile/example
        run: |
          xcodebuild \
            -workspace ios/appmobileexample.xcworkspace \
            -scheme appmobileexample \
            -configuration Release \
            -sdk iphonesimulator \
            -arch arm64 \
            -derivedDataPath ios/build \
            -parallelizeTargets \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
      - name: Package .app
        working-directory: packages/app-mobile/example
        run: |
          mkdir -p artifact
          cp -r ios/build/Build/Products/Release-iphonesimulator/appmobileexample.app artifact/
          cd artifact && zip -r appmobileexample.zip appmobileexample.app
      - uses: actions/upload-artifact@v4
        with:
          name: appmobileexample-ios-simulator
          path: packages/app-mobile/example/artifact/appmobileexample.zip

  build-android:
    name: Native / Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [rust, js, bindings]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - run: >-
          rustup target add
          aarch64-linux-android
          armv7-linux-androideabi
          x86_64-linux-android
          i686-linux-android
      - uses: actions/download-artifact@v4
        with:
          name: android-bindings
          path: packages/app-mobile/android/src/main/java/uniffi/
      - run: cargo xtask build-android
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Prebuild
        working-directory: packages/app-mobile/example
        run: npx expo prebuild -p android
      - name: Build Android APK
        working-directory: packages/app-mobile/example/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: appmobileexample-android
          path: packages/app-mobile/example/android/app/build/outputs/apk/debug/app-debug.apk

  ci-pass:
    name: CI
    if: always()
    needs: [rust, js, coverage, build-ios, build-android]
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
